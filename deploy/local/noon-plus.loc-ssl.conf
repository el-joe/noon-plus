# Noon Plus (Nawy) on Apache, local HTTPS variant: https://*.noon-plus.loc
# Needed for camera / microphone (getUserMedia) in the live studio, which
# browsers only allow on secure origins. Self-signed wildcard certificate
# from deploy/local/make-cert.sh (git-ignored deploy/local/certs/); local only.
# Installed by deploy/local/install.sh --ssl -> /etc/apache2/sites-available/noon-plus.loc-ssl.conf
# Needs: ssl, proxy, proxy_http, proxy_wstunnel, rewrite, headers.


<IfModule mod_ssl.c>

# ---------------------------------------------------------------- storefront
<VirtualHost *:443>
    ServerName noon-plus.loc
    ServerAlias www.noon-plus.loc

    SSLEngine on
    SSLCertificateFile    /var/www/noon-plus/deploy/local/certs/noon-plus.loc.crt
    SSLCertificateKeyFile /var/www/noon-plus/deploy/local/certs/noon-plus.loc.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_ssl_access.log combined
</VirtualHost>

# ---------------------------------------------------------------- public partner portal (Next.js)
<VirtualHost *:443>
    ServerName business.noon-plus.loc

    SSLEngine on
    SSLCertificateFile    /var/www/noon-plus/deploy/local/certs/noon-plus.loc.crt
    SSLCertificateKeyFile /var/www/noon-plus/deploy/local/certs/noon-plus.loc.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    RewriteEngine On
    RewriteRule ^/$ /join [R=302,L]

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_ssl_access.log combined
</VirtualHost>

# ---------------------------------------------------------------- Laravel: API + Blade panels
<VirtualHost *:443>
    ServerName api.noon-plus.loc
    ServerAlias admin.noon-plus.loc partner.noon-plus.loc travel-agency.noon-plus.loc
    ServerAlias carrier.noon-plus.loc delivery.noon-plus.loc marketer.noon-plus.loc

    SSLEngine on
    SSLCertificateFile    /var/www/noon-plus/deploy/local/certs/noon-plus.loc.crt
    SSLCertificateKeyFile /var/www/noon-plus/deploy/local/certs/noon-plus.loc.key

    DocumentRoot /var/www/noon-plus/backend/public

    <Directory /var/www/noon-plus/backend/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    LimitRequestBody 104857600

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_backend_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_backend_ssl_access.log combined
</VirtualHost>

# ---------------------------------------------------------------- Reverb websockets (wss)
<VirtualHost *:443>
    ServerName ws.noon-plus.loc

    SSLEngine on
    SSLCertificateFile    /var/www/noon-plus/deploy/local/certs/noon-plus.loc.crt
    SSLCertificateKeyFile /var/www/noon-plus/deploy/local/certs/noon-plus.loc.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 600

    # /apps first: ProxyPass matches by prefix, so "/app" would also catch "/apps/...".
    ProxyPass        /apps http://127.0.0.1:8080/apps
    ProxyPassReverse /apps http://127.0.0.1:8080/apps
    ProxyPass        /app  http://127.0.0.1:8080/app upgrade=websocket
    ProxyPassReverse /app  http://127.0.0.1:8080/app

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_ws_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_ws_ssl_access.log combined
</VirtualHost>

</IfModule>
