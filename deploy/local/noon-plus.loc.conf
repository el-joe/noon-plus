# Noon Plus (Nawy) on Apache, local only: http://*.noon-plus.loc
# Installed by deploy/local/install.sh -> /etc/apache2/sites-available/noon-plus.loc.conf
# Needs: proxy, proxy_http, proxy_wstunnel, rewrite, headers (php8.3 for the backend).
#
#   noon-plus.loc, www.            -> Next.js storefront   (127.0.0.1:3000, `next start`)
#   business.noon-plus.loc         -> Next.js partner portal (same app, "/" opens /join)
#   api. + admin. partner. travel-agency. carrier. delivery. marketer.
#                                  -> Laravel backend/public via mod_php
#   ws.noon-plus.loc               -> Reverb (127.0.0.1:8080, `php artisan reverb:start`)


# ---------------------------------------------------------------- storefront
<VirtualHost *:80>
    ServerName noon-plus.loc
    ServerAlias www.noon-plus.loc

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_access.log combined
</VirtualHost>

# ---------------------------------------------------------------- public partner portal (Next.js)
<VirtualHost *:80>
    ServerName business.noon-plus.loc

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "http"

    # The portal's landing page; the website then adds the visitor's market (/uae-en/join).
    # mod_rewrite, not RedirectMatch: rewrite runs before ProxyPass, mod_alias after it.
    RewriteEngine On
    RewriteRule ^/$ /join [R=302,L]

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_access.log combined
</VirtualHost>

# ---------------------------------------------------------------- Laravel: API + Blade panels
<VirtualHost *:80>
    ServerName api.noon-plus.loc
    ServerAlias admin.noon-plus.loc partner.noon-plus.loc travel-agency.noon-plus.loc
    ServerAlias carrier.noon-plus.loc delivery.noon-plus.loc marketer.noon-plus.loc

    DocumentRoot /var/www/noon-plus/backend/public

    <Directory /var/www/noon-plus/backend/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploads (product images, documents, live media): 100 MB, as php.ini post_max_size.
    LimitRequestBody 104857600

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_backend_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_backend_access.log combined
</VirtualHost>

# ---------------------------------------------------------------- Reverb websockets
<VirtualHost *:80>
    ServerName ws.noon-plus.loc

    ProxyRequests Off
    ProxyPreserveHost On
    # Reverb pings every 60 s; keep idle sockets open longer than that.
    ProxyTimeout 600

    # /app/{key} = websocket clients (browsers, apps); /apps/{id}/... = Laravel's HTTP event API.
    # /apps first: ProxyPass matches by prefix, so "/app" would also catch "/apps/...".
    ProxyPass        /apps http://127.0.0.1:8080/apps
    ProxyPassReverse /apps http://127.0.0.1:8080/apps
    ProxyPass        /app  http://127.0.0.1:8080/app upgrade=websocket
    ProxyPassReverse /app  http://127.0.0.1:8080/app

    ErrorLog ${APACHE_LOG_DIR}/noon-plus.loc_ws_error.log
    CustomLog ${APACHE_LOG_DIR}/noon-plus.loc_ws_access.log combined
</VirtualHost>
