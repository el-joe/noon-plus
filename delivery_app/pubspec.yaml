name: delivery_app
description: "Nawy delivery app for delivery agents (WP10 part B, ADR 15 code match)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# `nawy_core` is a local path package in this repository (packages/nawy_core;
# it brings flutter_secure_storage, image_picker, path_provider and
# url_launcher). Owner-approved packages: owner-review D16.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nawy_core:
    path: ../packages/nawy_core
  geolocator: ^14.1.2
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
