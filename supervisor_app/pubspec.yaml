name: supervisor_app
description: "Nawy Fleet app for carrier supervisors: dispatch board, failed deliveries and drivers (WP10 part B)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# No pub packages (project rule). `nawy_core` is a local path package in this
# repository (packages/nawy_core); flutter_localizations ships with the SDK.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nawy_core:
    path: ../packages/nawy_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
